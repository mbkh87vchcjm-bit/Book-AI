name: CI & Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright Chromium
        run: |
          npx playwright-core install chromium

      - name: Run unit tests
        run: |
          npm test

      - name: Run retrieval quality benchmark
        run: |
          npm run benchmark:retrieval

      - name: Run browser integration tests
        run: |
          npm run test:browser

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midad-2.0.0-local-apk
          path: release/Midad-2.0.0-local.apk


  windows-desktop:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify Electron runtime version
        working-directory: desktop
        run: npm run electron:version

      - name: Run desktop cyber parser and inventory tests
        working-directory: desktop
        run: npm run test:cyber

      - name: Build Windows x64 installer and portable app
        working-directory: desktop
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        working-directory: desktop
        shell: pwsh
        run: |
          $files = Get-ChildItem .\\release\\*.exe
          if ($files.Count -ne 2) { throw \"Expected installer and portable EXE; found $($files.Count)\" }
          $lines = $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { \"$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))\" }
          $lines | Set-Content .\\release\\SHA256SUMS.txt -Encoding ascii
          Get-Content .\\release\\SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Midad-Cyber-Windows-x64
          path: |
            desktop/release/Midad-Cyber-Setup-*-x64.exe
            desktop/release/Midad-Cyber-Portable-*-x64.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
