name: Midad quality checks

on:
  push:
    branches:
      - main
      - fix/midad-arabic-search-2026-10-31
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Node unit tests and syntax checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/engine.js
          node --check app/src/main/assets/web/neural-semantic.js
          node --check app/src/main/assets/web/knowledge-graph.js
          node --check app/src/main/assets/web/local-answer.js
          node --check app/src/main/assets/web/ocr.js
          node --check tests/browser.test.cjs
      - name: Run unit tests
        run: npm test

  browser-tests:
    name: Chromium integration tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright-core install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser

  android-build:
    name: Build and verify Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android build packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build and verify APK
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midad-local-debug-apk
          path: release/Midad-2.0.0-local.apk
          if-no-files-found: error
          retention-days: 14
